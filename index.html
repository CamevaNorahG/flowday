<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FlowDay - 流日程</title>
  <meta name="description" content="灵活的日程管理与行动记录工具" />
  <meta name="theme-color" content="#6366F1" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>" />
  <link rel="manifest" href="manifest.json" />
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cat: {
              class: { DEFAULT: '#8B5CF6', light: '#EDE9FE', medium: '#C4B5FD' },
              work: { DEFAULT: '#3B82F6', light: '#DBEAFE', medium: '#93C5FD' },
              study: { DEFAULT: '#10B981', light: '#D1FAE5', medium: '#6EE7B7' },
              life: { DEFAULT: '#F59E0B', light: '#FEF3C7', medium: '#FCD34D' },
            },
            period: { short: '#EC4899', mid: '#06B6D4', long: '#F97316' }
          },
          fontFamily: { sans: ['"Inter"', '"Noto Sans SC"', 'system-ui', '-apple-system', 'sans-serif'] }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-primary: #F8FAFC;
      --bg-secondary: #F0F4FF;
      --bg-tertiary: #FDF2F8;
      --bg-card: rgba(255,255,255,0.75);
      --text-primary: #1E293B;
      --text-secondary: #64748B;
      --text-muted: #94A3B8;
      --border-color: #E2E8F0;
      --input-bg: #F8FAFC;
      --accent-primary: #6366F1;
      --accent-secondary: #A855F7;
      --accent-tertiary: #EC4899;
    }
    [data-theme="dark"] {
      --bg-primary: #0F172A;
      --bg-secondary: #1E293B;
      --bg-tertiary: #334155;
      --bg-card: rgba(30,41,59,0.75);
      --text-primary: #F1F5F9;
      --text-secondary: #CBD5E1;
      --text-muted: #64748B;
      --border-color: #334155;
      --input-bg: #1E293B;
      --accent-primary: #818CF8;
      --accent-secondary: #C084FC;
      --accent-tertiary: #F472B6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-family: 'Inter', 'Noto Sans SC', system-ui, -apple-system, sans-serif; }
    body { background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 40%, var(--bg-tertiary) 70%, var(--bg-primary) 100%); min-height: 100vh; overflow-x: hidden; position: relative; color: var(--text-primary); transition: background 0.3s ease, color 0.3s ease; }
    body::before { content: ''; position: fixed; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(ellipse at 20% 20%, rgba(99,102,241,0.04) 0%, transparent 50%), radial-gradient(ellipse at 80% 80%, rgba(168,85,247,0.04) 0%, transparent 50%), radial-gradient(ellipse at 60% 30%, rgba(236,72,153,0.03) 0%, transparent 40%); pointer-events: none; z-index: 0; }
    .card-hover { transition: all 0.2s ease; }
    .card-hover:hover { transform: translateY(-2px); box-shadow: 0 8px 25px -5px rgba(99,102,241,0.12), 0 4px 10px -3px rgba(0,0,0,0.06); }
    .task-card { transition: all 0.25s ease; }
    .task-card:active { transform: scale(0.98); }
    .glass { background: var(--bg-card); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    .category-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .period-badge { font-size: 0.65rem; padding: 2px 8px; border-radius: 9999px; font-weight: 600; letter-spacing: 0.02em; }
    .checkbox-custom { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid #CBD5E1; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .checkbox-custom.checked { border-color: transparent; }

    [data-theme="dark"] .bg-white { background-color: #1E293B !important; }
    [data-theme="dark"] .bg-slate-50 { background-color: #0F172A !important; }
    [data-theme="dark"] .bg-slate-100 { background-color: #334155 !important; }
    [data-theme="dark"] .text-slate-800 { color: #F1F5F9 !important; }
    [data-theme="dark"] .text-slate-700 { color: #E2E8F0 !important; }
    [data-theme="dark"] .text-slate-600 { color: #CBD5E1 !important; }
    [data-theme="dark"] .text-slate-500 { color: #94A3B8 !important; }
    [data-theme="dark"] .text-slate-400 { color: #64748B !important; }
    [data-theme="dark"] .border-slate-100 { border-color: #334155 !important; }
    [data-theme="dark"] .border-slate-200 { border-color: #475569 !important; }
    [data-theme="dark"] .hover\:bg-slate-50:hover { background-color: #334155 !important; }
    [data-theme="dark"] .hover\:bg-slate-100:hover { background-color: #475569 !important; }
    [data-theme="dark"] input, [data-theme="dark"] textarea { background-color: var(--input-bg) !important; color: var(--text-primary) !important; }
    [data-theme="dark"] .modal-overlay { background: rgba(0,0,0,0.6) !important; }
    .checkbox-custom.checked::after { content: '\2713'; color: white; font-size: 12px; font-weight: 700; }
    .modal-overlay { background: rgba(15,23,42,0.4); backdrop-filter: blur(4px); }
    input, textarea, select { font-family: inherit; }
    textarea { resize: vertical; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 2px; }
    .streak-flame { animation: flicker 1.5s ease-in-out infinite alternate; }
    @keyframes flicker { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .time-badge { font-size: 0.7rem; padding: 2px 6px; border-radius: 6px; background: #F1F5F9; color: #64748B; font-weight: 500; font-variant-numeric: tabular-nums; }
    .day-toggle { width: 32px; height: 32px; border-radius: 50%; font-size: 0.75rem; font-weight: 600; transition: all 0.15s ease; }
    .day-toggle.active { color: white; }
    .note-saved { animation: noteFlash 1.5s ease; }
    @keyframes noteFlash { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    .timeline-container { position: relative; }
    .timeline-hour-line { position: absolute; left: 48px; right: 0; border-top: 1px solid #F1F5F9; }
    .timeline-hour-label { position: absolute; left: 0; width: 44px; text-align: right; font-size: 0.7rem; color: #94A3B8; font-variant-numeric: tabular-nums; transform: translateY(-50%); }
    .timeline-block { position: absolute; left: 52px; right: 4px; border-radius: 8px; padding: 4px 10px; overflow: hidden; display: flex; flex-direction: column; justify-content: center; transition: all 0.2s ease; cursor: default; }
    .timeline-block:hover { filter: brightness(0.95); transform: scale(1.01); }
    .timeline-block-title { font-size: 0.75rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .timeline-block-time { font-size: 0.65rem; opacity: 0.7; font-variant-numeric: tabular-nums; }
    .focus-timer-widget { position: fixed; bottom: 80px; right: 16px; z-index: 50; background: white; border-radius: 20px; box-shadow: 0 8px 30px -4px rgba(99,102,241,0.2), 0 2px 8px -2px rgba(0,0,0,0.08); padding: 16px 20px; min-width: 220px; }
    @keyframes timerSlideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .focus-timer-widget.pomodoro-done { animation: pomodoroPulse 0.6s ease 3; }
    @keyframes pomodoroPulse { 0%,100% { box-shadow: 0 8px 30px -4px rgba(99,102,241,0.2); } 50% { box-shadow: 0 8px 30px -4px rgba(16,185,129,0.4); } }
    .focus-timer-time { font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; color: #1E293B; line-height: 1; }
    .focus-timer-task { font-size: 0.75rem; color: #64748B; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; margin-top: 4px; }
    .focus-timer-btn { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; transition: all 0.15s ease; }
    .focus-timer-btn:active { transform: scale(0.92); }
    .focus-timer-mode { font-size: 0.65rem; padding: 2px 8px; border-radius: 9999px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; }
    .confetti-particle { position: fixed; width: 10px; height: 10px; pointer-events: none; z-index: 9999; animation: confettiFall 1.5s ease-out forwards; }
    @keyframes confettiFall { 0% { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); } 100% { opacity: 0; transform: translateY(100vh) rotate(720deg) scale(0.5); } }
    .calendar-chain { position: absolute; bottom: 2px; right: 2px; font-size: 8px; opacity: 0.7; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="text/template" id="tpl-app">
    <div class="min-h-screen pb-20 md:pb-0 md:pl-64 relative z-10">
      <!-- Desktop Sidebar -->
      <aside class="hidden md:flex md:flex-col md:fixed md:inset-y-0 md:left-0 md:w-64 bg-white/80 backdrop-blur-xl border-r border-white/40 z-30">
        <div class="flex items-center gap-3 px-6 py-5 border-b border-slate-100">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-500 flex items-center justify-center text-white font-bold text-sm">F</div>
          <div>
            <h1 class="text-lg font-bold text-slate-800">FlowDay</h1>
            <p class="text-xs text-slate-400">流日程</p>
          </div>
        </div>
        <nav class="flex-1 px-3 py-4 space-y-1">
          <button v-for="v in views" :key="v.id" @click="currentView = v.id"
            :class="['w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all', currentView === v.id ? 'bg-indigo-50 text-indigo-700' : 'text-slate-500 hover:bg-slate-50 hover:text-slate-700']">
            <span class="text-lg">{{ v.icon }}</span>
            <span>{{ v.label }}</span>
          </button>
        </nav>
        <div class="px-4 py-4 border-t border-slate-100">
          <div class="bg-gradient-to-br from-indigo-50 to-purple-50 rounded-xl p-4 mb-3">
            <div class="flex items-center gap-2 mb-2">
              <span class="streak-flame text-lg">&#128293;</span>
              <span class="text-sm font-semibold text-slate-700">连续 {{ streakDays }} 天</span>
            </div>
            <p class="text-xs text-slate-500">坚持记录每一天</p>
          </div>
          <div v-if="currentUser">
            <div class="flex items-center gap-2 px-3 py-2 bg-slate-50 rounded-xl mb-2">
              <div class="w-7 h-7 rounded-full bg-gradient-to-br from-indigo-400 to-purple-400 flex items-center justify-center text-white text-xs font-bold">{{ currentUser.email[0].toUpperCase() }}</div>
              <span class="text-xs text-slate-600 truncate flex-1">{{ currentUser.email }}</span>
            </div>
            <div class="flex gap-1.5">
              <button @click="syncNow" class="flex-1 py-2 bg-indigo-50 text-indigo-600 rounded-lg text-xs font-medium hover:bg-indigo-100 transition">同步</button>
              <button @click="logout" class="flex-1 py-2 bg-slate-100 text-slate-500 rounded-lg text-xs font-medium hover:bg-slate-200 transition">退出</button>
            </div>
          </div>
          <button v-else @click="showAuthModal = true" class="w-full py-2.5 bg-gradient-to-r from-indigo-500 to-purple-500 text-white rounded-xl text-sm font-medium hover:opacity-90 transition">
            登录 / 注册
          </button>
        </div>
      </aside>

      <!-- Mobile Header -->
      <header class="md:hidden sticky top-0 z-30 glass border-b border-slate-100">
        <div class="flex items-center justify-between px-4 py-3">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-500 flex items-center justify-center text-white font-bold text-xs">F</div>
            <span class="font-bold text-slate-800">FlowDay</span>
          </div>
          <div class="flex items-center gap-2">
            <button v-if="!currentUser" @click="showAuthModal = true" class="px-2.5 py-1 bg-indigo-50 text-indigo-600 rounded-lg text-xs font-medium">登录</button>
            <div v-else class="flex items-center gap-1.5">
              <span v-if="syncStatus === '同步中...'" class="text-xs text-indigo-400">&#8635;</span>
              <span v-else-if="syncStatus === '已同步'" class="text-xs text-emerald-400">&#10003;</span>
              <div class="w-6 h-6 rounded-full bg-gradient-to-br from-indigo-400 to-purple-400 flex items-center justify-center text-white text-[10px] font-bold" @click="currentView = 'settings'">{{ currentUser.email[0].toUpperCase() }}</div>
            </div>
            <span class="streak-flame text-sm">&#128293;</span>
            <span class="text-xs font-semibold text-slate-600">{{ streakDays }}天</span>
          </div>
        </div>
      </header>

      <!-- Main Content -->
      <main class="max-w-4xl mx-auto px-4 py-4 md:py-6">
        <!-- Date Navigator -->
        <div class="flex items-center justify-between mb-5">
          <button @click="navigateDate(-1)" class="w-9 h-9 rounded-full flex items-center justify-center hover:bg-slate-100 transition text-slate-500">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
          </button>
          <div class="text-center">
            <h2 class="text-lg font-bold text-slate-800">{{ formatDateHeader(selectedDate) }}</h2>
            <p class="text-xs text-slate-400">{{ formatDateSub(selectedDate) }}</p>
          </div>
          <button @click="navigateDate(1)" class="w-9 h-9 rounded-full flex items-center justify-center hover:bg-slate-100 transition text-slate-500">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
          </button>
        </div>

        <!-- TODAY VIEW -->
        <div v-if="currentView === 'today'">
          <div class="grid grid-cols-4 gap-2 mb-5">
            <div v-for="cat in mainCategories" :key="cat.id" class="card-hover rounded-xl p-3 text-center cursor-pointer" :style="{ background: cat.light }" @click="openAddTaskModal(true, cat.id)">
              <div class="text-lg mb-1">{{ cat.icon }}</div>
              <div class="text-lg font-bold" :style="{ color: cat.color }">{{ getCategoryCount(cat.id) }}</div>
              <div class="text-xs text-slate-500 truncate">{{ cat.name }}</div>
            </div>
          </div>
          <div class="mb-4">
            <div class="flex items-center justify-between mb-3">
              <h3 class="font-semibold text-slate-700">{{ selectedDateLabel }}行动</h3>
              <div class="flex items-center gap-2">
                <span class="text-xs text-slate-400">{{ todayDoneCount }}/{{ todayActions.length }}</span>
                <div class="w-20 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                  <div class="h-full bg-gradient-to-r from-indigo-500 to-purple-500 rounded-full transition-all duration-500" :style="{ width: todayProgress + '%' }"></div>
                </div>
              </div>
            </div>
            <div v-if="todayActions.length === 0" class="text-center py-12">
              <div class="text-4xl mb-3">&#128203;</div>
              <p class="text-slate-400 text-sm mb-3">{{ isToday ? '今天还没有行动安排' : '这天还没有行动安排' }}</p>
              <button @click="openAddTaskModal(true)" class="px-4 py-2 bg-indigo-500 text-white rounded-xl text-sm font-medium hover:bg-indigo-600 transition">添加行动到{{ selectedDateLabel }}</button>
            </div>
            <div v-else class="space-y-2">
              <div v-for="action in todayActions" :key="action.id" class="task-card bg-white rounded-xl p-4 border border-slate-100 card-hover cursor-pointer" :class="{ 'opacity-60': action.done }" @click="editActionTask(action)">
                <div class="flex items-start gap-3">
                  <div class="checkbox-custom mt-0.5" :class="{ checked: action.done }" :style="action.done ? { background: getCategoryColor(action.category) } : {}" @click.stop="toggleTodayAction(action)"></div>
                  <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 mb-1">
                      <span class="category-dot" :style="{ background: getCategoryColor(action.category) }"></span>
                      <span class="text-sm font-medium text-slate-700 truncate">{{ action.title }}</span>
                      <span v-if="action.startTime" class="time-badge ml-auto flex-shrink-0">{{ action.startTime }}<span v-if="action.endTime">-{{ action.endTime }}</span></span>
                    </div>
                    <p v-if="getActionDescription(action.taskId)" class="text-xs text-slate-400 mb-1.5 line-clamp-2">{{ getActionDescription(action.taskId) }}</p>
                    <div class="flex items-center gap-2 flex-wrap">
                      <span class="text-xs text-slate-400">{{ getCategoryName(action.category) }}</span>
                      <template v-if="action.subcategory">
                        <span class="text-xs text-slate-300">&middot;</span>
                        <span class="text-xs text-slate-400">{{ action.subcategory }}</span>
                      </template>
                      <span v-if="getTaskPeriod(action.taskId)" class="period-badge" :style="{ background: getPeriodColor(getTaskPeriod(action.taskId)) + '20', color: getPeriodColor(getTaskPeriod(action.taskId)) }">{{ getPeriodName(getTaskPeriod(action.taskId)) }}</span>
                      <span v-if="getTaskRecurrenceText(action.taskId)" class="text-xs text-indigo-400">{{ getTaskRecurrenceText(action.taskId) }}</span>
                    </div>
                    <div v-if="editingTimeId === action.id" @click.stop class="flex items-center gap-2 mt-3 pt-3 border-t border-slate-50">
                      <span class="text-xs text-slate-400">开始</span>
                      <input type="time" :value="action.startTime" @change="setActionTime(action, 'startTime', $event.target.value)" class="px-2 py-1 bg-slate-50 rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-200" />
                      <span class="text-xs text-slate-400">结束</span>
                      <input type="time" :value="action.endTime" @change="setActionTime(action, 'endTime', $event.target.value)" class="px-2 py-1 bg-slate-50 rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-200" />
                      <button @click="editingTimeId = ''" class="text-xs text-slate-400 hover:text-slate-600 ml-1">完成</button>
                    </div>
                  </div>
                  <div class="flex items-center gap-0.5 flex-shrink-0">
                    <button @click.stop="toggleFocusTimer(action.taskId)" class="text-slate-300 hover:text-indigo-400 transition p-1" :class="{ 'text-indigo-500': timerTaskId === action.taskId && timerRunning }" :title="timerTaskId === action.taskId ? '计时中...' : '开始专注'">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                    </button>
                    <button @click.stop="toggleTimeEdit(action.id)" class="text-slate-300 hover:text-indigo-400 transition p-1" :class="{ 'text-indigo-400': editingTimeId === action.id }">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    </button>
                    <button @click.stop="removeTodayAction(action.id)" class="text-slate-300 hover:text-red-400 transition p-1">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div v-if="availableTasks.length > 0" class="mb-4">
            <h3 class="font-semibold text-slate-700 mb-3">从任务池添加到{{ selectedDateLabel }}</h3>
            <div class="flex gap-2 overflow-x-auto pb-2 -mx-1 px-1 no-scrollbar">
              <button v-for="task in availableTasks" :key="task.id" @click="addToToday(task.id)" class="task-card flex-shrink-0 bg-white rounded-xl px-4 py-3 border border-slate-100 text-left" style="max-width:200px">
                <div class="flex items-center gap-2 mb-1">
                  <span class="category-dot" :style="{ background: getCategoryColor(task.category) }"></span>
                  <span class="text-sm font-medium text-slate-700 truncate">{{ task.title }}</span>
                </div>
                <div class="flex items-center gap-2">
                  <span class="text-xs text-slate-400">{{ getCategoryName(task.category) }}</span>
                  <span v-if="task.period" class="period-badge" :style="{ background: getPeriodColor(task.period) + '20', color: getPeriodColor(task.period) }">{{ getPeriodName(task.period) }}</span>
                </div>
              </button>
            </div>
          </div>
          <button @click="openAddTaskModal(true)" class="w-full py-3 border-2 border-dashed border-slate-200 rounded-xl text-sm text-slate-400 hover:border-indigo-300 hover:text-indigo-500 transition flex items-center justify-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            新建行动
          </button>

          <!-- Daily Notes -->
          <div class="mt-5">
            <div class="bg-white rounded-2xl border border-slate-100 p-4">
              <div class="flex items-center gap-2 mb-3">
                <span class="text-base">&#9997;</span>

        var timelineData = computed(function() {
          var actions = todayActions.value.filter(function(a) { return a.startTime; });
          actions.sort(function(a, b) { return a.startTime < b.startTime ? -1 : 1; });
          var hourHeight = 56;
          if (actions.length === 0) return { actions: [], startHour: 8, endHour: 22, hours: [], totalHeight: 0 };
          var minHour = 24, maxHour = 0;
          actions.forEach(function(a) {
            var sp = a.startTime.split(':');
            var sh = parseInt(sp[0]);
            if (sh < minHour) minHour = sh;
            var eh = sh + 1;
            if (a.endTime) {
              var ep = a.endTime.split(':');
              eh = parseInt(ep[0]);
              var em = parseInt(ep[1]);
              if (em > 0) eh++;
              if (eh <= sh) eh = sh + 1;
            }
            if (eh > maxHour) maxHour = eh;
          });
          minHour = Math.max(minHour, 0);
          maxHour = Math.min(maxHour + 1, 24);
          if (maxHour - minHour < 2) maxHour = minHour + 2;
          var totalHeight = (maxHour - minHour) * hourHeight;
          var positioned = actions.map(function(a) {
            var sp = a.startTime.split(':');
            var startMin = parseInt(sp[0]) * 60 + parseInt(sp[1]);
            var endMin = startMin + 60;
            if (a.endTime) {
              var ep = a.endTime.split(':');
              endMin = parseInt(ep[0]) * 60 + parseInt(ep[1]);
              if (endMin <= startMin) endMin = startMin + 60;
            }
            var top = (startMin - minHour * 60) / 60 * hourHeight;
            var height = (endMin - startMin) / 60 * hourHeight;
            return { action: a, top: top, height: Math.max(height, 28), durationMin: endMin - startMin };
          });
          var hours = [];
          for (var h = minHour; h <= maxHour; h++) {
            hours.push({ hour: h, label: (h < 10 ? '0' : '') + h + ':00', top: (h - minHour) * hourHeight });
          }
          return { actions: positioned, startHour: minHour, endHour: maxHour, hours: hours, totalHeight: totalHeight };

          for (var i = firstDay - 1; i >= 0; i--) {

            var records = dailyRecords.value.filter(function(r) { return r.date === dateStr; });

            var completionRate = records.length > 0 ? doneCount / records.length : 0;
            days.push({ dayNum: dayNum, date: dateStr, currentMonth: false, isToday: dateStr === today, hasRecords: records.length > 0, doneCount: doneCount, totalCount: records.length, completionRate: completionRate, categoryColors: Array.from(new Set(records.map(function(r) { return getCategoryColor(r.category); }))).slice(0, 3) });

          for (var j = 1; j <= daysInMonth; j++) {

            days.push({ dayNum: j, date: dateStr2, currentMonth: true, isToday: dateStr2 === today, hasRecords: records2.length > 0, doneCount: doneCount2, totalCount: records2.length, completionRate: completionRate2, categoryColors: Array.from(new Set(records2.map(function(r) { return getCategoryColor(r.category); }))).slice(0, 3) });
          }
          var remaining = 42 - days.length;
          for (var k = 1; k <= Math.max(remaining, 0); k++) {
            var nm = month + 1; var ny = year;
            if (nm > 11) { nm = 0; ny++; }

          }
          var streak = 0;
          for (var s = 0; s < days.length; s++) {
            if (days[s].doneCount > 0) { streak++; } else { streak = 0; }
            days[s].streakLength = streak;
          }
          return days;

        }

        function importData(e) {
          var file = e.target.files[0];
          if (!file) return;
          var reader = new FileReader();
          reader.onload = function(ev) {
            try {
              var data = JSON.parse(ev.target.result);
              if (data.tasks) { tasks.value = data.tasks; saveTasks(); }
              if (data.records) { dailyRecords.value = data.records; saveRecords(); }
              if (data.categories) { categories.value = data.categories; saveCategories(); }
              if (data.subcategories) { subcategories.value = data.subcategories; saveSubcats(); }
              if (data.dailyNotes) { Object.assign(dailyNotes, data.dailyNotes); saveNotes(); }
              if (data.recurringState) { Object.assign(recurringState, data.recurringState); saveRecurringState(); }
              if (data.dismissedRecurring) { Object.assign(dismissedRecurring, data.dismissedRecurring); saveDismissed(); }
              dailyNoteInput.value = dailyNotes[selectedDate.value] || '';
              alert('导入成功！');
            } catch (err) { alert('导入失败：文件格式错误'); }
          };
          reader.readAsText(file);
          e.target.value = '';
        }

        function clearAllData() {
          if (!confirm('确定清除所有数据？此操作不可恢复！')) return;
          tasks.value = []; dailyRecords.value = [];
          Object.keys(dailyNotes).forEach(function(k) { delete dailyNotes[k]; });
          Object.keys(recurringState).forEach(function(k) { delete recurringState[k]; });
          Object.keys(dismissedRecurring).forEach(function(k) { delete dismissedRecurring[k]; });
          saveTasks(); saveRecords(); saveNotes(); saveRecurringState(); saveDismissed();
          dailyNoteInput.value = '';
          if (currentUser.value) cloudSave();
        }

        function submitAuth() {
          authError.value = '';
          if (!authEmail.value.trim() || !authPassword.value) {
            authError.value = '请填写邮箱和密码';
            return;
          }
          if (authPassword.value.length < 6) {
            authError.value = '密码至少需要6位';
            return;
          }
          authLoading.value = true;
          var promise;
          if (authMode.value === 'login') {
            promise = auth.signInWithEmailAndPassword(authEmail.value, authPassword.value);
          } else {
            promise = auth.createUserWithEmailAndPassword(authEmail.value, authPassword.value);
          }
          promise.then(function() {
            showAuthModal.value = false;
            authEmail.value = ''; authPassword.value = ''; authError.value = '';
          }).catch(function(err) {
            var msgs = {
              'auth/user-not-found': '该邮箱未注册',
              'auth/wrong-password': '密码错误',
              'auth/invalid-email': '邮箱格式不正确',
              'auth/email-already-in-use': '该邮箱已注册',
              'auth/weak-password': '密码强度不够',
              'auth/invalid-credential': '邮箱或密码错误',
            };
            authError.value = msgs[err.code] || err.message;
          }).finally(function() { authLoading.value = false; });
        }

        function logout() {
          clearAllData();
          auth.signOut();
          syncStatus.value = '';
        }

        function cloudSave() {
          if (!currentUser.value || isSyncing.value) return;
          isSyncing.value = true;
          syncStatus.value = '同步中...';
          var data = {
            tasks: tasks.value,
            records: dailyRecords.value,
            categories: categories.value,
            subcategories: subcategories.value,
            notes: Object.assign({}, dailyNotes),
            recurringState: Object.assign({}, recurringState),
            dismissedRecurring: Object.assign({}, dismissedRecurring),
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          };
          db.collection('flowday_data').doc(currentUser.value.uid).set(data)
            .then(function() {
              syncStatus.value = '已同步';
              setTimeout(function() { if (syncStatus.value === '已同步') syncStatus.value = ''; }, 3000);
            })
            .catch(function(err) {
              console.error('Sync error:', err);
              syncStatus.value = '同步失败';
              setTimeout(function() { if (syncStatus.value === '同步失败') syncStatus.value = ''; }, 5000);
            })
            .finally(function() { isSyncing.value = false; });
        }

        function cloudLoad() {
          if (!currentUser.value) return Promise.resolve();
          syncStatus.value = '同步中...';
          return db.collection('flowday_data').doc(currentUser.value.uid).get()
            .then(function(doc) {
              if (doc.exists) {
                var data = doc.data();
                if (data.tasks) tasks.value = data.tasks;
                if (data.records) dailyRecords.value = data.records;
                if (data.categories) categories.value = data.categories;
                if (data.subcategories) subcategories.value = data.subcategories;
                if (data.notes) {
                  Object.keys(dailyNotes).forEach(function(k) { delete dailyNotes[k]; });
                  Object.assign(dailyNotes, data.notes);
                }
                if (data.recurringState) {
                  Object.keys(recurringState).forEach(function(k) { delete recurringState[k]; });
                  Object.assign(recurringState, data.recurringState);
                }
                if (data.dismissedRecurring) {
                  Object.keys(dismissedRecurring).forEach(function(k) { delete dismissedRecurring[k]; });
                  Object.assign(dismissedRecurring, data.dismissedRecurring);
                }
                saveTasks(); saveRecords(); saveCategories(); saveSubcats(); saveNotes(); saveRecurringState(); saveDismissed();
                var loadedNote = dailyNotes[selectedDate.value];
                dailyNoteInput.value = (loadedNote && typeof loadedNote === 'object') ? (loadedNote.text || '') : (loadedNote || '');
              }
              syncStatus.value = '已同步';
              setTimeout(function() { if (syncStatus.value === '已同步') syncStatus.value = ''; }, 3000);
            })
            .catch(function(err) {
              console.error('Load error:', err);
              syncStatus.value = '同步失败';
              setTimeout(function() { syncStatus.value = ''; }, 5000);
            });
        }

        function scheduleSync() {
          if (!currentUser.value) return;
          clearTimeout(syncTimer);
          syncTimer = setTimeout(cloudSave, 2000);
        }

        function syncNow() {
          if (currentUser.value) cloudSave();
        }

        window.addEventListener('beforeunload', function() {
          if (currentUser.value) cloudSave();
        });

        watch(selectedDate, function() {
          editingTimeId.value = '';
          var note = dailyNotes[selectedDate.value];
          dailyNoteInput.value = (note && typeof note === 'object') ? (note.text || '') : (note || '');
          noteSaved.value = false;
        });

        watch(calendarMonth, function(val) {
          if (val < 0) { calendarMonth.value = 11; calendarYear.value--; }
          if (val > 11) { calendarMonth.value = 0; calendarYear.value++; }
        });

        watch(currentView, function(val) {
          if (val === 'analytics' || val === 'calendar') renderCharts();
        });

        onMounted(function() {
          auth.onAuthStateChanged(function(user) {
            if (user) {
              currentUser.value = { uid: user.uid, email: user.email };
              load();
              cloudLoad().then(function() { migrateOneOffTasks(); setTimeout(checkReminders, 1000); });
            } else {
              currentUser.value = null;
              clearAllData();
            }
          });
        });

        return {
          currentView: currentView, selectedDate: selectedDate, views: views, mobileViews: mobileViews,
          weekDays: weekDays, periods: periods, poolFilters: poolFilters, recurrenceOptions: recurrenceOptions,
          tasks: tasks, dailyRecords: dailyRecords, categories: categories, subcategories: subcategories,
          dailyNotes: dailyNotes, recurringState: recurringState, dismissedRecurring: dismissedRecurring,
          showTaskModal: showTaskModal, editingTask: editingTask, addToTodayFlag: addToTodayFlag,
          filterCategory: filterCategory, poolFilter: poolFilter, taskForm: taskForm,
          tagInput: tagInput, calendarMonth: calendarMonth, calendarYear: calendarYear,
          newSubcategoryInput: newSubcategoryInput, editingTimeId: editingTimeId,
          dailyNoteInput: dailyNoteInput, noteSaved: noteSaved,
          mainCategories: mainCategories, filteredTasks: filteredTasks, todayActions: todayActions,
          todayDoneCount: todayDoneCount, todayProgress: todayProgress, isToday: isToday, selectedDateLabel: selectedDateLabel, availableTasks: availableTasks,
          streakDays: streakDays, totalActionsCount: totalActionsCount, totalDoneCount: totalDoneCount,
          activeTasksCount: activeTasksCount,
          weeklySummary: weeklySummary, categoryChartData: categoryChartData, last14Days: last14Days,
          notificationsEnabled: notificationsEnabled, notificationPermissionDenied: notificationPermissionDenied,
          toggleNotifications: toggleNotifications,
          currentTheme: currentTheme, toggleTheme: toggleTheme,
          timelineData: timelineData, untimedActions: untimedActions, timedActionCount: timedActionCount,
          totalTimedText: totalTimedText, totalAllCategoryMinutes: totalAllCategoryMinutes,
          calendarTitle: calendarTitle, calendarDays: calendarDays,
          formatDate: formatDate, formatDateHeader: formatDateHeader, formatDateSub: formatDateSub,
          navigateDate: navigateDate,
          getCategoryColor: getCategoryColor, getCategoryName: getCategoryName, getCategoryIcon: getCategoryIcon,
          getCategoryCount: getCategoryCount, getCategoryActionCount: getCategoryActionCount, getCategoryPercent: getCategoryPercent,
          getCategoryTimeMinutes: getCategoryTimeMinutes, getCategoryTimeText: getCategoryTimeText, getCategoryTimePercent: getCategoryTimePercent,
          formatDuration: formatDuration,
          getPeriodColor: getPeriodColor, getPeriodName: getPeriodName, getSubcategories: getSubcategories,
          isOverdue: isOverdue, getTaskProgress: getTaskProgress, getTaskPeriod: getTaskPeriod, getTaskTodayCount: getTaskTodayCount,
          getTaskRecurrenceText: getTaskRecurrenceText, getRecurrenceText: getRecurrenceText,
          openAddTaskModal: openAddTaskModal, openEditTaskModal: openEditTaskModal, closeTaskModal: closeTaskModal,
          saveTask: saveTask, deleteTask: deleteTask,
          editActionTask: editActionTask, getActionDescription: getActionDescription,
          addToToday: addToToday, toggleTodayAction: toggleTodayAction, removeTodayAction: removeTodayAction,
          toggleTimeEdit: toggleTimeEdit, setActionTime: setActionTime,
          getDayRecords: getDayRecords, getDayRecordsSorted: getDayRecordsSorted,
          addTag: addTag, toggleRecurrenceDay: toggleRecurrenceDay,
          addCategory: addCategory, removeCategory: removeCategory,
          addSubcategory: addSubcategory, removeSubcategory: removeSubcategory,
          saveCategories: saveCategories, saveDailyNote: saveDailyNote, debounceSaveNote: debounceSaveNote,
          exportData: exportData, importData: importData, clearAllData: clearAllData,
          currentUser: currentUser, showAuthModal: showAuthModal, authMode: authMode,
          authEmail: authEmail, authPassword: authPassword, authError: authError, authLoading: authLoading,
          syncStatus: syncStatus, submitAuth: submitAuth, logout: logout, syncNow: syncNow,
          timerTaskId: timerTaskId, timerRunning: timerRunning, timerSeconds: timerSeconds,
          timerMode: timerMode, timerPomodoroDone: timerPomodoroDone,
          timerDisplay: timerDisplay, timerTaskTitle: timerTaskTitle,
          toggleFocusTimer: toggleFocusTimer, toggleTimerPause: toggleTimerPause,
          stopTimer: stopTimer, dismissTimer: dismissTimer, toggleTimerMode: toggleTimerMode,
          showMoodPopup: showMoodPopup, moodOptions: moodOptions,
          showMoodSelector: showMoodSelector, saveMood: saveMood, skipMood: skipMood,
          getMoodEmoji: getMoodEmoji, getDailyMood: getDailyMood, setDailyMood: setDailyMood,
          getMoodColor: getMoodColor, moodTrendData: moodTrendData, moodCalendarData: moodCalendarData,
          averageMood: averageMood, getCompletionStyle: getCompletionStyle,
        };
      }
    });

    app.mount('#app');
  </script>
</body>
</html>
